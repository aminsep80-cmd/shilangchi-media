<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:V;src:url(Vazirmatn-FD-Black.ttf);font-weight:900}
@font-face{font-family:V;src:url(Vazirmatn-FD-Bold.ttf);font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const BLUE='#2B3FE0',YEL='#F5C518';
const imgs={};['green','abnama','blue','gray'].forEach(n=>{const i=new Image();i.src=n+'.jpg';imgs[n]=i});
const S=[[0,3,'hook'],[3,8,'farm'],[8,12.5,'fountain'],[12.5,17,'fuel'],[17,21.5,'sludge'],[21.5,25.5,'end']];
const TOTAL=25.5;
const ease=u=>u<0?0:u>1?1:1-Math.pow(1-u,3);
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
// sample points along a polyline/bezier list
function bez(p0,p1,p2,p3,n=60){const a=[];for(let i=0;i<=n;i++){const t=i/n,m=1-t;a.push([m*m*m*p0[0]+3*m*m*t*p1[0]+3*m*t*t*p2[0]+t*t*t*p3[0],m*m*m*p0[1]+3*m*m*t*p1[1]+3*m*t*t*p2[1]+t*t*t*p3[1]])}return a}
function lens(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return L}
function at(pts,L,u){const d=u*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<d)i++;const f=(d-L[i-1])/(L[i]-L[i-1]||1);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f]}
function hose(pts,col,ridge,w,t,flow,reveal=1,rev=false,clear=false){
 const L=lens(pts),n=Math.max(2,Math.floor(pts.length*reveal));const P=pts.slice(0,n);
 x.lineCap='round';x.lineJoin='round';
 const path=()=>{x.beginPath();x.moveTo(P[0][0],P[0][1]);P.forEach(p=>x.lineTo(p[0],p[1]))};
 path();x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=w+10;x.stroke();
 path();x.strokeStyle=col;x.lineWidth=w;x.stroke();
 if(flow&&reveal>=1){const N=26;for(let i=0;i<N;i++){let u=((t*0.55)+(i/N))%1;if(rev)u=1-u;const q=at(pts,L,u);x.fillStyle=flow;x.globalAlpha=clear?.9:.75;x.beginPath();x.arc(q[0],q[1],w*0.22,0,7);x.fill()}x.globalAlpha=1}
 path();x.setLineDash([5,9]);x.lineDashOffset=-t*20;x.strokeStyle=ridge;x.lineWidth=w-6;x.stroke();x.setLineDash([]);
 path();x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=w*0.18;x.translate(-w*0.18,-w*0.18);x.stroke();x.setTransform(1,0,0,1,0,0);
}
function card(t0,t,title,sub){const a=ease((t-t0)/0.5);x.save();x.globalAlpha=a;x.translate(0,(1-a)*-40);
 x.font='900 74px V';x.direction='rtl';const w1=x.measureText(title).width;x.font='700 42px V';const w2=sub?x.measureText(sub).width:0;
 const w=Math.max(w1,w2)+110,h=sub?200:140,X=(W-w)/2,Y=280;
 x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=30;rr(X,Y,w,h,30);x.fillStyle=BLUE;x.fill();x.shadowBlur=0;
 rr(X,Y+h-12,w,12,6);x.fillStyle=YEL;x.fill();
 x.textAlign='center';x.fillStyle='#fff';x.font='900 74px V';x.fillText(title,W/2,Y+98);
 if(sub){x.fillStyle=YEL;x.font='700 42px V';x.fillText(sub,W/2,Y+160)}x.restore()}
function inset(t0,t,name){const a=ease((t-t0-0.6)/0.5);if(a<=0)return;const iw=320,ih=400,X=(W-iw)/2,Y=540;x.save();x.globalAlpha=a;x.translate(0,(1-a)*60);
 x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=30;rr(X-8,Y-8,iw+16,ih+16,26);x.fillStyle='#fff';x.fill();x.shadowBlur=0;
 x.save();rr(X,Y,iw,ih,20);x.clip();const im=imgs[name];if(im.complete)x.drawImage(im,X,Y,iw,ih);x.restore();x.restore()}
function wm(){x.font='600 30px Arial';x.direction='ltr';x.textAlign='left';x.fillStyle='rgba(255,255,255,.85)';x.fillText('shilangchi.com',40,1500)}
function sky(a,b){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,W,H)}
function water(ox,oy,vx,vy,t,col,N=40,g=900,spread=0.25){for(let i=0;i<N;i++){const life=((t*1.2)+i/N)%1,T=life*0.9;const s=1+((i*37)%10-5)/5*spread;
 const px=ox+vx*s*T,py=oy+vy*T+0.5*g*T*T;x.globalAlpha=1-life;x.fillStyle=col;x.beginPath();x.arc(px,py,6+life*6,0,7);x.fill()}x.globalAlpha=1}

const farmHose1=bez([60,1330],[120,1260],[160,1200],[245,1175]);
const farmHose2=bez([330,1185],[480,1230],[560,1420],[760,1280]);
function farm(t){sky('#7EC8F0','#FFE3A3');x.fillStyle='#FFD36B';x.beginPath();x.arc(930,640,80,0,7);x.fill();
 x.fillStyle='#7A5A3A';x.fillRect(0,1050,W,H);for(let i=0;i<14;i++){x.strokeStyle=i%2?'#5E9E3B':'#4C8A2E';x.lineWidth=18;x.beginPath();x.moveTo(540+(i-7)*30,1050);x.lineTo(540+(i-7)*170,H);x.stroke()}
 x.fillStyle='#3E8FD8';x.beginPath();x.moveTo(0,1300);x.lineTo(160,1300);x.lineTo(0,1500);x.fill();
 x.fillStyle='#C0392B';rr(240,1120,110,110,14);x.fill();x.fillStyle='#333';rr(255,1095,80,30,8);x.fill();x.fillStyle='#555';x.beginPath();x.arc(295,1175,28,0,7);x.fill();
 hose(farmHose1,'#1F9D6B','#7FE0B0',46,t,'#BFE9FF',1,false);hose(farmHose2,'#1F9D6B','#7FE0B0',46,t,'#BFE9FF',1,false);
 water(770,1272,260,-260,t,'rgba(170,220,255,.9)',50,900)}
const fHose=bez([140,1560],[300,1600],[420,1500],[540,1420]);
function fountain(t){sky('#2C3E77','#F7A86B');x.fillStyle='#E9E1D3';x.beginPath();x.ellipse(540,1440,430,120,0,0,7);x.fill();x.fillStyle='#4AA3DF';x.beginPath();x.ellipse(540,1440,390,95,0,0,7);x.fill();
 x.fillStyle='#D9CFBF';rr(500,1260,80,170,10);x.fill();
 for(let k=-2;k<=2;k++)water(540,1260,k*120,-1100,t+k*0.13,'rgba(220,240,255,.95)',36,1500,0.12);
 x.fillStyle='#777';rr(70,1520,110,80,12);x.fill();
 hose(fHose,'rgba(235,245,255,.55)','rgba(255,255,255,.95)',40,t,'#7CC7FF',1,false,true)}
const fuelHose=bez([350,1330],[460,1500],[640,1500],[800,1330]);
function fuel(t){sky('#9FB7C9','#E6E2DA');x.fillStyle='#8E8E8E';x.fillRect(0,1420,W,H);
 x.fillStyle='#D8D8D8';rr(-80,1060,430,250,60);x.fill();x.fillStyle=BLUE;rr(-80,1160,430,30,0);x.fill();x.fillStyle='#E14B3B';rr(-80,1290,520,60,10);x.fill();
 x.fillStyle='#222';[[40,1360],[260,1360]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],48,0,7);x.fill()});
 x.fillStyle='#555';rr(330,1300,40,40,6);x.fill();
 x.fillStyle='#2F6F3E';rr(780,1250,170,220,14);x.fill();x.strokeStyle='#1E4A28';x.lineWidth=8;[1300,1360,1420].forEach(y=>{x.beginPath();x.moveTo(780,y);x.lineTo(950,y);x.stroke()});
 hose(fuelHose,'#1D3A8A','#5F82E8',48,t,'#E0A33A',1,false);water(805,1325,10,60,t,'rgba(224,163,58,.9)',20,300,0.1)}
const sHose=bez([250,1500],[380,1300],[600,1300],[720,1180]);
function sludge(t){sky('#B9C4CC','#EDE7DD');x.fillStyle='#9B8B76';x.fillRect(0,1400,W,H);
 x.fillStyle='#4B3A2A';x.beginPath();x.ellipse(230,1520,170,55,0,0,7);x.fill();x.fillStyle='#6B5238';x.beginPath();x.ellipse(230,1515,140,40,0,0,7);x.fill();
 x.fillStyle='#F0F0F0';rr(680,1060,460,280,40);x.fill();x.fillStyle=YEL;rr(680,1150,460,26,0);x.fill();x.fillStyle='#E67E22';rr(640,1320,500,60,10);x.fill();
 x.fillStyle='#222';[[740,1390],[1000,1390]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],50,0,7);x.fill()});
 hose(sHose,'#8C9196','#D3D7DA',50,t,'#6B5238',1,true)}
const hookHose=(()=>{const a=[];for(let i=0;i<=120;i++){const u=i/120;a.push([80+u*920,1000+Math.sin(u*Math.PI*3)*180])}return a})();
function hook(t){sky('#2B3FE0','#1A2690');hose(hookHose,'#1F9D6B','#7FE0B0',60,t,null,Math.min(1,0.05+t/1.6));
 const a=ease((t-0.3)/0.6);x.save();x.globalAlpha=a;x.direction='rtl';x.textAlign='center';x.fillStyle='#fff';x.font='900 92px V';x.fillText('شیلنگ‌های ما',W/2,520);x.fillText('کجا کار می‌کنن؟',W/2,640);x.fillStyle=YEL;x.font='700 46px V';x.fillText('۴ کاربرد در ۲۰ ثانیه 👇',W/2,1350);x.restore()}
function end(t){sky('#2B3FE0','#1A2690');x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=26;x.beginPath();x.arc(70,150,450,0,7);x.stroke();x.beginPath();x.arc(1030,1450,350,0,7);x.stroke();
 const a=ease(t/0.6);x.save();x.globalAlpha=a;x.direction='rtl';x.textAlign='center';x.fillStyle='#fff';x.font='900 170px V';x.fillText('شیلنگچی',W/2,520);
 rr(W/2-110,580,220,14,7);x.fillStyle=YEL;x.fill();x.fillStyle='#fff';x.font='700 54px V';x.fillText('از تولیدکننده بخر',W/2,720);
 x.fillText('قیمت روز: هایلایت «لیست قیمت»',W/2,810);x.fillText('سفارش: سایز و متراژ رو دایرکت کن',W/2,900);
 x.font='900 90px V';x.direction='ltr';x.fillText('۰۹۱۲ ۶۹۸ ۵۹۹۷',W/2,1070);x.direction='ltr';x.font='600 38px Arial';x.globalAlpha=a*.85;x.fillText('shilangchi.com',W/2,1140);x.restore()}
const META={farm:['آبیاری کشاورزی','خرطومی سبز','green'],fountain:['آبنما و مصارف بهداشتی','آبنما فنردار شفاف · تا ۷۰ درجه','abnama'],fuel:['انتقال گازوئیل و مواد نفتی','خرطومی آبی نفتی','blue'],sludge:['لجن‌کش و آبیاری','خرطومی طوسی','gray']};
const F={hook,farm,fountain,fuel,sludge,end};
window.render=function(T){x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);let s=S.find(s=>T>=s[0]&&T<s[1])||S[S.length-1];const t=T-s[0];
 F[s[2]](t);const m=META[s[2]];if(m){card(0,t,m[0],m[1]);inset(0,t,m[2]);wm()}
 if(t<0.3&&s[0]>0){x.fillStyle=`rgba(255,255,255,${1-t/0.3})`;x.fillRect(0,0,W,H)}};
window.TOTAL=TOTAL;
</script></body></html>
